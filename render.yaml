services:
  - type: web
    name: pharmacon-prescription-anonymizer
    rootDir: prescription_anonymizer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RENDER_LOW_MEMORY
        value: "1"
