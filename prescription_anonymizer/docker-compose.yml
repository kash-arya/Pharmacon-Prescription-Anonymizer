version: '3.8'

services:
  # Python Medical Prescription Anonymizer Microservice
  anonymizer-service:
    build: .
    container_name: pharmacon-anonymizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data/tessdata:/app/data/tessdata:ro

